AWSTemplateFormatVersion: '2010-09-09'
Description: Sample CloudFormation template for PQC scanner demo

Resources:
  # KMS key with RSA spec - quantum vulnerable
  SigningKey:
    Type: AWS::KMS::Key
    Properties:
      Description: RSA signing key
      KeySpec: RSA_2048
      KeyUsage: SIGN_VERIFY
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  # S3 Bucket with encryption
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-data'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
              # AES-256 is quantum resistant

  # ALB Listener with TLS
  ApiListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      # TLS 1.3 cipher suites use ECDHE key exchange
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  # Certificate
  ApiCertificate:
    Type: AWS::ACM::Certificate
    Properties:
      DomainName: api.example.com
      ValidationMethod: DNS
      # Default uses RSA_2048 - quantum vulnerable
      KeyAlgorithm: RSA_2048
